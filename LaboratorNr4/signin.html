<!DOCTYPE html>
<html>
<head>
    <title>getTech Sign Up</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <a href="hp.html" class="logo"><strong>getTech</strong></a>
        
        <h1>Welcome!</h1>
        <p>It seems you don't have a getTech account.<br>Let's create a new one!</p>

    <div class="form-section">
    <p class="user-email-display"><strong>Email:</strong> user@example.com</p>

    <form action="register.php" method="POST">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="user@example.com" required>

        <label for="fullname">Full name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>

        <label for="password">Choose a secure password:</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <label for="confirm">Confirm password:</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required>

        <button type="submit" class="btn-continue">Create Account</button>
    </form>
    </div>

        <p class="signup-text">
            By continuing, you agree to our <br>
            <strong>Terms and Conditions</strong>.
        </p>
    </div>

</body>
</html>
