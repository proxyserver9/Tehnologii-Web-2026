<!DOCTYPE html>
<html>
<head>
    <title>getTech Cart</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <a href="hp.html"><strong>getTech</strong></a>
    <div class="search-box">
        <input type="text" placeholder="Search..." size="40">
    </div>
    <div class="first-nav-links">
        <a href="login.html">My Account</a>
        <a href="cart.html">Cart</a>
    </div>
</div>

<br>

<div class="second-nav-links">
    <a href="hp.html">Products</a>
    <a href="offers.html">Offers</a>
    <a href="card.html">getTech Card</a>
</div>

<div class="cart-container">
    <h2>Shopping Cart</h2>

    <div class="cart-item">
        <div class="cart-item-left">
            <input type="checkbox" class="cart-checkbox" checked>
            <img src="pictures/mouse.png" alt="Mouse" class="cart-item-img">
        </div>
        
        <div class="cart-item-right">
            <div class="cart-item-header">
                <span class="cart-item-title">Item Name</span>
                <button class="btn-delete" title="Remove item">🗑️</button>
            </div>
            
            <div class="cart-item-footer">
                <div class="cart-item-price">Price</div>
                <div class="cart-qty-wrapper">
                    <select class="qty-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-item">
        <div class="cart-item-left">
            <input type="checkbox" class="cart-checkbox" checked>
            <img src="pictures/keyboard.png" alt="Keyboard" class="cart-item-img">
        </div>
        
        <div class="cart-item-right">
            <div class="cart-item-header">
                <span class="cart-item-title">Item name</span>
                <button class="btn-delete" title="Remove item">🗑️</button>
            </div>
            
            <div class="cart-item-footer">
                <div class="cart-item-price">Price</div>
                <div class="cart-qty-wrapper">
                    <select class="qty-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
